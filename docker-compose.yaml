services:
  ghostroot-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghostroot-app
    container_name: ghostroot-server
    ports:
      - "8000:8000"
    volumes:
      - ./datas/ghostroot/:/root/.local/share/ghostroot/
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/projects', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 3s
    restart: unless-stopped
    command: ["uv", "run", "ghostroot", "serve", "--host", "0.0.0.0", "--no-access-log"]
  ghostroot-dispatcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghostroot-app
    container_name: ghostroot-dispatcher
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dispatch.yaml:/ghostroot/dispatch.yaml
    depends_on:
      ghostroot-server:
        condition: service_healthy
    restart: unless-stopped
    command: ["uv", "run", "ghostroot", "dispatch", "--config", "dispatch.yaml"]
