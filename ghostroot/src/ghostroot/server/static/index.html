    snapshotNodePositions() {
      const positions = new Map();
      if (!this.cy) return positions;
      this.cy.nodes().forEach(node => {
        positions.set(node.id(), { x: node.position('x'), y: node.position('y') });
      });
      return positions;
    },

    anchorPositionFromIds(nodeIds, previousPositions, offset = 36) {
      const anchors = [];
      for (const nodeId of nodeIds) {
        const existing = this.cy?.getElementById(nodeId);
        if (existing?.length) {
          anchors.push({ x: existing.position('x'), y: existing.position('y') });
          continue;
        }
        const previous = previousPositions.get(nodeId);
        if (previous) anchors.push(previous);
      }
      if (anchors.length === 0) return null;
      const center = anchors.reduce((acc, pos) => ({ x: acc.x + pos.x, y: acc.y + pos.y }), { x: 0, y: 0 });
      const avg = { x: center.x / anchors.length, y: center.y / anchors.length };
      return this.layoutDirection() === 'TB'
        ? { x: avg.x, y: avg.y + offset }
        : { x: avg.x + offset, y: avg.y };
    },

    initialPositionForNode(nodeData, previousPositions) {
      if (!this.project) return null;
      if (nodeData.intentId) {
        const previousPlaceholder = previousPositions.get(nodeData.id);
        if (previousPlaceholder) return previousPlaceholder;
        const intent = this.project.intents.find(item => item.id === nodeData.intentId);
        return intent ? this.anchorPositionFromIds(intent.from, previousPositions, 32) : null;
      }

      const producingIntent = this.project.intents.find(item => item.to === nodeData.id);
      if (!producingIntent) return null;
      const placeholderPosition = previousPositions.get(`_ph_${producingIntent.id}`);
      if (placeholderPosition) return placeholderPosition;
      return this.anchorPositionFromIds(producingIntent.from, previousPositions, 44);
    },

    fadeInFreshElement(element) {
      if (!element || element.length === 0) return;
      element.addClass('fresh');
      setTimeout(() => {
        if (!element.inside()) return;
        element.animate(
          { style: { opacity: 1 } },
          {
            duration: 500,
            complete: () => {
              if (!element.inside()) return;
              element.removeStyle('opacity');
            },
          },
        );
        element.removeClass('fresh');
      }, 30);
    },

    updateGraph() {
      if (!this.cy || !this.project) return;
      const { nodes, edges } = this.buildElements();
      const wantNodes = new Set(nodes.map(n => n.data.id));
      const wantEdges = new Set(edges.map(e => e.data.id));
      const previousPositions = this.snapshotNodePositions();
      let changed = false;

      this.cy.nodes().forEach(n => { if (!wantNodes.has(n.id())) { n.remove(); changed = true; } });
      this.cy.edges().forEach(e => { if (!wantEdges.has(e.id())) { e.remove(); changed = true; } });

      for (const n of nodes) {
        const ex = this.cy.getElementById(n.data.id);
        if (ex.length === 0) {
          const initialPosition = this.initialPositionForNode(n.data, previousPositions);
          const a = this.cy.add(initialPosition ? { ...n, position: initialPosition } : n);
          this.fadeInFreshElement(a);
          changed = true;
        } else if (
          ex.data('nodeType') !== n.data.nodeType ||
          ex.data('label') !== n.data.label ||
          ex.data('description') !== n.data.description ||
          ex.data('width') !== n.data.width ||
          ex.data('height') !== n.data.height ||
          ex.data('borderColor') !== n.data.borderColor ||
          ex.data('atomCount') !== n.data.atomCount
        ) {
          ex.data(n.data); changed = true;
        }
      }
      for (const e of edges) {
        const ex = this.cy.getElementById(e.data.id);
        if (ex.length === 0) {
          const a = this.cy.add(e);
          this.fadeInFreshElement(a);
          changed = true;
        } else if (
          ex.data('status') !== e.data.status ||
          ex.data('label') !== e.data.label ||
          ex.data('edgeColor') !== e.data.edgeColor ||
          ex.data('edgeTextColor') !== e.data.edgeTextColor ||
          ex.data('edgeBackground') !== e.data.edgeBackground ||
          ex.data('edgeLineStyle') !== e.data.edgeLineStyle ||
          ex.data('edgeWidth') !== e.data.edgeWidth
        ) {
          ex.data(e.data);
        }
      }
      if (changed) this.cy.layout(this.layoutOpts()).run();
      this.pulseActive();
      this.refreshGraphDecorations();
      this.scheduleIntelCardOverlayRender();
    },

    pulseActive() {
      if (!this.cy) return;
      this.cy.nodes('[nodeType="in_progress"], [nodeType="structured_in_progress"], [nodeType="bootstrap_running"]').forEach(node => {
        if (node.scratch('_pulseActive')) return;
        node.scratch('_pulseActive', true);
        const isBootstrap = node.data('nodeType') === 'bootstrap_running';
        const minOpacity = isBootstrap ? 0.55 : 0.35;
        const maxOpacity = isBootstrap ? 0.98 : 0.8;
        const pulseOut = () => {
          if (!node.inside()) {
            node.removeScratch('_pulseActive');
            return;
          }
          node.animate({ style:{'background-opacity':minOpacity} }, { duration:900, complete: pulseIn });
        };
        const pulseIn = () => {
          if (!node.inside()) {
            node.removeScratch('_pulseActive');
            return;
          }
          node.animate({ style:{'background-opacity':maxOpacity} }, { duration:900, complete: pulseOut });
        };
        pulseOut();
      });
      this.cy.edges('[status="in_progress"], [status="structured_in_progress"], [status="bootstrap_running"]').forEach(edge => {
        if (edge.scratch('_flowActive')) return;
        edge.scratch('_flowActive', true);
        const isBootstrap = edge.data('status') === 'bootstrap_running';
        const dashOffset = isBootstrap ? -16 : -12;
        const flow = () => {
          if (!edge.inside() || !['in_progress', 'structured_in_progress', 'bootstrap_running'].includes(edge.data('status'))) {
            edge.removeScratch('_flowActive');
            return;
          }
          edge.animate({ style:{'line-dash-offset':dashOffset} }, {
            duration:isBootstrap ? 620 : 700,
            complete:() => {
              if (!edge.inside() || !['in_progress', 'structured_in_progress', 'bootstrap_running'].includes(edge.data('status'))) {
                edge.removeScratch('_flowActive');
                return;
              }
              edge.style('line-dash-offset', 0);
              flow();
            }
          });
        };
        flow();
      });
    },

    fitGraph() { if (this.cy) this.cy.fit(undefined, 50); },

    centerGraphOnElements(eles) {
      if (!this.cy || !eles || eles.length === 0) return;
      if (this._centerAnimation) this._centerAnimation.stop();
      this._centerAnimation = this.cy.animation({ center: { eles }, duration: 220, easing: 'ease-in-out-cubic' });
      this._centerAnimation.play();
    },

    centerGraphOnFact(factId) {
      if (!this.cy || !factId) return;
      const node = this.cy.getElementById(factId);
      if (node.length > 0) this.centerGraphOnElements(node);
    },

    centerGraphOnIntent(intentId) {
      if (!this.cy || !intentId) return;
      const edges = this.cy.edges(`[intentId="${intentId}"]`);
      if (edges.length === 0) return;
      this.centerGraphOnElements(edges.add(edges.sources()).add(edges.targets()));
    },

    summarizeFactLabel(fact) {
      if (fact.id === 'origin') return this.t('Origin');
      if (fact.id === 'goal') return this.t('Goal');
      if (this.hasStructuredFact(fact)) {
        return this.intelFactHeadline(fact);
      }
      const normalized = fact.description.replace(/\s+/g, ' ').trim();
      const chars = Array.from(normalized);
      if (chars.length <= 24) return normalized || fact.id;
      return `${chars.slice(0, 24).join('')}…`;
    },

    factNodeSize(label, nodeType, fact = null) {
      if (nodeType === 'structured_fact') {
        const atomCount = Array.isArray(fact?.atoms) ? fact.atoms.length : 0;
        return { width: 224, height: atomCount > 0 ? 138 : 112 };
      }
      const preset = ['fact', 'structured_fact'].includes(nodeType)
        ? { fontSize: 10, maxTextWidth: 116, minWidth: 52, minHeight: 34, paddingX: 10, paddingY: 10 }
        : { fontSize: 11, maxTextWidth: 92, minWidth: 58, minHeight: 38, paddingX: 10, paddingY: 10 };

      const measured = this.measureWrappedText(label, preset.maxTextWidth, preset.fontSize);
      return {
        width: Math.max(preset.minWidth, Math.ceil(measured.width + preset.paddingX * 2)),
        height: Math.max(preset.minHeight, Math.ceil(measured.height + preset.paddingY * 2)),
      };
    },

    measureWrappedText(text, maxWidth, fontSize) {
      const content = (text || '').trim() || ' ';
      const lines = [];
      let currentWidth = 0;
      let currentChars = 0;
      let maxLineWidth = 0;

      const pushLine = () => {
        if (currentChars === 0 && lines.length > 0) lines.push(0);
        else if (currentChars > 0) lines.push(currentWidth);
        maxLineWidth = Math.max(maxLineWidth, currentWidth);
        currentWidth = 0;
        currentChars = 0;
      };

      for (const char of Array.from(content)) {
        if (char === '\n') {
          pushLine();
          continue;
        }
        const charWidth = this.estimateLabelCharWidth(char, fontSize);
        if (currentChars > 0 && currentWidth + charWidth > maxWidth) pushLine();
        currentWidth += charWidth;
        currentChars += 1;
      }

      pushLine();

      const lineCount = Math.max(1, lines.length);
      const lineHeight = fontSize * 1.35;
      return {
        width: Math.min(maxWidth, Math.max(fontSize * 1.6, maxLineWidth)),
        height: lineCount * lineHeight,
      };
    },

    estimateLabelCharWidth(char, fontSize) {
      if (/\s/.test(char)) return fontSize * 0.35;
      if (/[\u1100-\u115F\u2E80-\uA4CF\uAC00-\uD7A3\uF900-\uFAFF\uFE10-\uFE6F\uFF00-\uFF60\uFFE0-\uFFE6]/.test(char)) {
        return fontSize * 1.0;
      }
      return fontSize * 0.58;
    },

    setupAutoFit() {
      this.teardownAutoFit();
      const container = document.getElementById('cy');
      if (!container || !this.cy) return;
      let fitTimer = null;
      this._resizeObserver = new ResizeObserver(() => {
        clearTimeout(fitTimer);
        fitTimer = setTimeout(() => {
          if (this.cy) {
            const clampedWidth = this.clampPanelWidth(this.sidePanelWidth);
            if (clampedWidth !== this.sidePanelWidth) {
              this.sidePanelWidth = clampedWidth;
              this.saveSidePanelWidth();
            }
            this.cy.resize();
            this.cy.fit(undefined, 50);
            this.scheduleIntelCardOverlayRender();
          }
        }, 200);
      });
      this._resizeObserver.observe(container);
    },

    teardownAutoFit() {
      if (this._resizeObserver) {
        this._resizeObserver.disconnect();
        this._resizeObserver = null;
      }
    },

    scheduleIntelCardOverlayRender() {
      if (this._intelCardOverlayFrame) return;
      const scheduleFrame = typeof requestAnimationFrame === 'function'
        ? requestAnimationFrame
        : callback => setTimeout(callback, 0);
      this._intelCardOverlayFrame = scheduleFrame(() => {
        this._intelCardOverlayFrame = null;
        this.renderIntelCardOverlays();
      });
    },

    clearIntelCardOverlays() {
      const layer = document.getElementById('intelCardLayer');
      if (layer) layer.replaceChildren();
    },

    renderIntelCardOverlays() {
      const layer = document.getElementById('intelCardLayer');
      if (!layer || !this.cy || !this.project) {
        if (layer) layer.replaceChildren();
        return;
      }
      const factsById = new Map((this.project.facts || []).map(fact => [fact.id, fact]));
      const visibleFacts = [];
      this.cy.nodes('[nodeType="structured_fact"]').forEach(node => {
        if (!node.inside()) return;
        const fact = factsById.get(node.id());
        if (!fact) return;
        visibleFacts.push({ node, fact });
      });

      const existing = new Map(Array.from(layer.querySelectorAll('.intel-card')).map(card => [card.dataset.factId, card]));
      const seen = new Set();
      const zoom = this.cy.zoom();
      for (const { node, fact } of visibleFacts) {
        const model = this.intelCardModel(fact);
        const position = node.renderedPosition();
        const width = Number(node.data('width')) || 224;
        const height = Number(node.data('height')) || 138;
        const left = position.x - (width * zoom) / 2;
        const top = position.y - (height * zoom) / 2;
        let card = existing.get(fact.id);
        if (!card) {
          card = document.createElement('article');
          card.className = 'intel-card';
          card.dataset.factId = fact.id;
          card.addEventListener('click', event => {
            event.stopPropagation();
            this.selectFactFromOverlay(fact.id, event.shiftKey);
          });
          layer.appendChild(card);
        }
        seen.add(fact.id);
        card.style.setProperty('--intel-border', model.borderColor);
        card.style.width = `${width}px`;
        card.style.height = `${height}px`;
        card.style.transform = `translate(${left}px, ${top}px) scale(${zoom})`;
        card.classList.toggle('is-selected', this.selectedFacts.includes(fact.id));
        card.classList.toggle('is-focus', this.selectedNode?.type === 'fact' && this.selectedNode.id === fact.id);
        const contentKey = this.intelCardContentKey(model);
        if (card.dataset.contentKey !== contentKey) {
          card.innerHTML = this.intelCardHtml(model);
          card.dataset.contentKey = contentKey;
        }
      }
      for (const [factId, card] of existing) {
        if (!seen.has(factId)) card.remove();
      }
    },

    selectFactFromOverlay(factId, multiSelect = false) {
      const keepLogFocus = this.sideTab === 'log';
      if (multiSelect) this.toggleFactSelection(factId);
      else {
        this.selectedFacts = [factId];
        this.selectFact(factId);
      }
      if (keepLogFocus) this.scrollTimelineToSelection();
      else this.sideTab = 'detail';
    },

    intelCardModel(fact) {
      const atoms = Array.isArray(fact?.atoms) ? fact.atoms : [];
      const atomLines = atoms.slice(0, 2).map(atom => this.compactAtomLine(atom, 86)).filter(Boolean);
      return {
        id: fact?.id || '',
        kind: this.humanizeValue(fact?.kind),
        summary: this.intelFactHeadline(fact, 84),
        atoms: atomLines,
        extraAtoms: Math.max(0, atoms.length - atomLines.length),
        fallbackMeta: this.intelFactFallbackBadges(fact),
        borderColor: this.factBorderColor(fact),
      };
    },

    intelCardHtml(model) {
      const atomHtml = model.atoms.length > 0
        ? `<div class="intel-card-stack">${model.atoms.map(line => `<div class="intel-atom-card">${this.escapeHtml(line)}</div>`).join('')}${model.extraAtoms > 0 ? `<span class="intel-card-more">+${model.extraAtoms}</span>` : ''}</div>`
        : `<div class="intel-card-meta">${model.fallbackMeta.map(item => `<span>${this.escapeHtml(item)}</span>`).join('')}</div>`;
      return `
        <div class="intel-card-head">
          <div class="intel-card-id">${this.escapeHtml(model.id)}</div>
          ${model.kind ? `<div class="intel-card-kind">${this.escapeHtml(model.kind)}</div>` : ''}
        </div>
        <div class="intel-card-summary">${this.escapeHtml(model.summary)}</div>
        ${atomHtml}
      `;
    },

    intelCardContentKey(model) {
      return JSON.stringify({
        id: model.id,
        kind: model.kind,
        summary: model.summary,
        atoms: model.atoms,
        extraAtoms: model.extraAtoms,
        fallbackMeta: model.fallbackMeta,
        borderColor: model.borderColor,
      });
    },

    intelFactFallbackBadges(fact) {
      const badges = [];
      if (fact?.outcome) badges.push(this.humanizeValue(fact.outcome));
      if (fact?.goal_relevance) badges.push(this.humanizeValue(fact.goal_relevance));
      if (Array.isArray(fact?.tags)) badges.push(...fact.tags.slice(0, 3).map(tag => this.humanizeValue(tag)));
      return badges.filter(Boolean).slice(0, 4);
    },

    applySelectedLayout() {
      this.layoutMode = this.isValidLayoutMode(this.layoutMode) ? this.layoutMode : 'dagre_lr';
      this.localPrefs.layout_mode = this.layoutMode;
      this.saveLocalPrefs();
      if (this.cy) this.cy.layout(this.layoutOpts()).run();
      this.scheduleIntelCardOverlayRender();
    },

    clampPanelWidth(width) {
      const containerWidth = document.getElementById('graphLayout')?.getBoundingClientRect().width || window.innerWidth;
      const min = 260;
      const max = Math.max(min, containerWidth - 260);
      return Math.min(max, Math.max(min, width));
    },

    startPanelResize(e) {
      e.currentTarget?.setPointerCapture?.(e.pointerId);
      this.isResizingPanel = true;
      this.onPanelResize(e);
    },

    onPanelResize(e) {
      if (!this.isResizingPanel) return;
      const rect = document.getElementById('graphLayout')?.getBoundingClientRect();
      if (!rect) return;
      this.sidePanelWidth = this.clampPanelWidth(rect.right - e.clientX);
    },

    stopPanelResize() {
      if (!this.isResizingPanel) return;
      this.isResizingPanel = false;
      this.saveSidePanelWidth();
    },

    clearGraphSelection(preserveTimeline = false) {
      this.selectedNode = null;
      this.selectedFacts = [];
      if (!preserveTimeline) this.selectedTimelineEntryId = null;
      this.clearTranslation();
      if (this.cy) this.cy.elements().removeClass('highlight focus faded selected-fact');
      this.scheduleIntelCardOverlayRender();
    },

    clearSelection() {
      this.clearGraphSelection(false);
    },

    toggleFactSelection(fid) {
      this.selectedTimelineEntryId = null;
      const idx = this.selectedFacts.indexOf(fid);
      if (idx >= 0) {
        this.selectedFacts.splice(idx, 1);
        if (this.selectedFacts.length === 0) {
          this.clearSelection();
          return;
        }
        if (this.selectedNode?.type === 'fact' && this.selectedNode.id === fid) {
          this.selectedNode = { type:'fact', id: this.selectedFacts[this.selectedFacts.length - 1] };
        }
      } else {
        this.selectedFacts.push(fid);
        this.selectedNode = { type:'fact', id: fid };
      }
      this.refreshGraphDecorations();
    },

    removeFactSelection(fid) {
      this.selectedTimelineEntryId = null;
      const idx = this.selectedFacts.indexOf(fid);
      if (idx < 0) return;
      this.selectedFacts.splice(idx, 1);
      if (this.selectedFacts.length === 0) {
        this.clearSelection();
        return;
      }
      if (this.selectedNode?.type === 'fact' && this.selectedNode.id === fid) {
        this.selectedNode = { type:'fact', id: this.selectedFacts[this.selectedFacts.length - 1] };
      }
      this.refreshGraphDecorations();
    },

    onNodeTap(e) {
      const node = e.target;
      const id = node.data('id');
      const nt = node.data('nodeType');
      const keepLogFocus = this.sideTab === 'log';

      if (['in_progress', 'unclaimed', 'structured_in_progress', 'structured_unclaimed', 'bootstrap_pending', 'bootstrap_running'].includes(nt)) {
        this.selectIntent(node.data('intentId'));
        if (keepLogFocus) this.scrollTimelineToSelection();
        else this.sideTab = 'detail';
        return;
      }
      if (e.originalEvent.shiftKey) {
        this.toggleFactSelection(id);
        if (keepLogFocus) this.scrollTimelineToSelection();
        else this.sideTab = 'detail';
        return;
      } else {
        this.selectedFacts = [id];
        this.selectFact(id);
      }
      if (keepLogFocus) this.scrollTimelineToSelection();
      else this.sideTab = 'detail';
    },

    onEdgeTap(e) {
      this.selectIntent(e.target.data('intentId'));
      if (this.sideTab === 'log') this.scrollTimelineToSelection();
      else this.sideTab = 'detail';
    },

    selectIntent(intent) {
      const intentId = typeof intent === 'string' ? intent : intent?.id;
      if (!intentId) return;
      this.clearTranslation();
      this.selectedFacts = [];
      this.selectedTimelineEntryId = null;
      this.selectedNode = { type:'intent', id: intentId };
      this.applyLineageHighlightForIntent(intentId);
    },

    selectFact(fact) {
      const factId = typeof fact === 'string' ? fact : fact?.id;
      if (!factId) return;
      this.clearTranslation();
      if (!this.selectedFacts.includes(factId)) this.selectedFacts = [factId];
      this.selectedTimelineEntryId = null;
      this.selectedNode = { type:'fact', id: factId };
      if (this.selectedFacts.length > 1) {
        this.applyMultiFactSelectionHighlight();
        return;
      }
      this.applyLineageHighlightForFact(factId);
    },

    refreshGraphDecorations() {
      if (!this.selectedNode) {
        this.syncFactSelections();
        this.scheduleIntelCardOverlayRender();
        return;
      }
      if (this.selectedNode.type === 'intent') this.applyLineageHighlightForIntent(this.selectedNode.id);
      if (this.selectedNode.type === 'fact') {
        if (this.selectedFacts.length > 1 && this.selectedFacts.includes(this.selectedNode.id)) {
          this.applyMultiFactSelectionHighlight();
          return;
        }
        this.applyLineageHighlightForFact(this.selectedNode.id);
      }
    },

    syncFactSelections() {
      if (!this.cy) return;
      this.cy.nodes().removeClass('selected-fact');
      for (const fid of this.selectedFacts) {
        const node = this.cy.getElementById(fid);
        if (node.length > 0) node.addClass('selected-fact');
      }
      this.scheduleIntelCardOverlayRender();
    },

    collectFactLineage(fid) {
      const upstreamFacts = new Set();
      const upstreamIntents = new Set();

      const walkFactUpstream = (factId) => {
        if (upstreamFacts.has(factId) || !this.project) return;
        upstreamFacts.add(factId);
        for (const intent of this.project.intents) {
          if (intent.to === factId) walkIntentUpstream(intent.id);
        }
      };

      const walkIntentUpstream = (iid) => {
        if (upstreamIntents.has(iid) || !this.project) return;
        upstreamIntents.add(iid);
        const intent = this.project.intents.find(i => i.id === iid);
        if (!intent) return;
        for (const sourceId of intent.from) walkFactUpstream(sourceId);
      };

      walkFactUpstream(fid);
      return { upstreamFacts, upstreamIntents };
    },

    collectIntentElements(intent, nodeIds, edgeIds) {
      if (intent.to) nodeIds.add(intent.to);
      else nodeIds.add(`_ph_${intent.id}`);
      for (const sourceId of intent.from) {
        nodeIds.add(sourceId);
        edgeIds.add(`${intent.id}_${sourceId}`);
      }
      if (this.isBootstrapIntent(intent)) {
        nodeIds.add('goal');
        edgeIds.add(`${intent.id}_goal`);
      }
    },

    applyLineageHighlightForIntent(intentId) {
      if (!this.cy || !this.project) return;
      const intent = this.project.intents.find(i => i.id === intentId);
      if (!intent) return;
      this.cy.elements().removeClass('highlight focus faded');

      const nodeIds = new Set();
      const edgeIds = new Set();
      this.collectIntentElements(intent, nodeIds, edgeIds);
      const highlightNodes = this.cy.nodes().filter(n => nodeIds.has(n.id()));
      const focusEdges = this.cy.edges().filter(e => edgeIds.has(e.id()));

      highlightNodes.addClass('highlight');
      focusEdges.addClass('focus');

      const visible = highlightNodes.add(focusEdges);
      this.cy.elements().not(visible).addClass('faded');
      this.syncFactSelections();
    },

    applyLineageHighlightForFact(factId) {
      if (!this.cy || !this.project) return;
      const { upstreamFacts, upstreamIntents } = this.collectFactLineage(factId);
      const nodeIds = new Set(upstreamFacts);
      const edgeIds = new Set();

      for (const iid of upstreamIntents) {
        const intent = this.project.intents.find(i => i.id === iid);
        if (intent) this.collectIntentElements(intent, nodeIds, edgeIds);
      }

      this.cy.elements().removeClass('highlight focus faded');
      const highlightNodes = this.cy.nodes().filter(n => nodeIds.has(n.id()));
      const highlightEdges = this.cy.edges().filter(e => edgeIds.has(e.id()));
      const focusNode = this.cy.getElementById(factId);

      highlightNodes.addClass('highlight');
      highlightEdges.addClass('highlight');
      focusNode.addClass('focus');

      const visible = highlightNodes.add(highlightEdges).add(focusNode);
      this.cy.elements().not(visible).addClass('faded');
      this.syncFactSelections();
    },

    applyMultiFactSelectionHighlight() {
      if (!this.cy) return;
      this.cy.elements().removeClass('highlight focus faded selected-fact');
      this.syncFactSelections();
    },

    getProducingIntent(fid) {
      return this.project ? this.project.intents.find(i => i.to === fid) || null : null;
    },

    selectedFactId() {
      return this.selectedNode?.type === 'fact' ? this.selectedNode.id : null;
    },

    selectedFactRecord() {
      const factId = this.selectedFactId();
      if (!this.project || !factId) return null;
      return this.project.facts.find(f => f.id === factId) || null;
    },

    hasStructuredFact(fact) {
      return !!(fact && (
        fact.kind ||
        fact.outcome ||
        fact.goal_relevance ||
        fact.next_policy ||
        (Array.isArray(fact.tags) && fact.tags.length > 0) ||
        (Array.isArray(fact.atoms) && fact.atoms.length > 0)
      ));
    },

    factStructuredBadges(fact) {
      if (!fact) return [];
      const badges = [];
      if (fact.kind) badges.push(fact.kind);
      if (fact.outcome) badges.push(fact.outcome);
      if (fact.goal_relevance) badges.push(fact.goal_relevance);
      if (fact.next_policy) badges.push(fact.next_policy);
      if (Array.isArray(fact.tags)) badges.push(...fact.tags.slice(0, 4));
      return badges;
    },

    factAtomPreview(fact) {
      if (!fact) return '';
      if (Array.isArray(fact.atoms) && fact.atoms.length > 0) {
        return fact.atoms.slice(0, 2).map(atom => this.formatAtom(atom)).join(' | ');
      }
      const badges = this.factStructuredBadges(fact);
      if (badges.length > 0) return badges.join(' / ');
      return this.truncateDescription(fact.description || fact.id, 80);
    },

    factBorderColor(fact) {
      if (!fact) return '#818cf8';
      const relevance = this.normalizedText(fact.goal_relevance).toLowerCase();
      const outcome = this.normalizedText(fact.outcome).toLowerCase();
      if (relevance === 'proves_goal' || relevance === 'proves goal' || outcome === 'goal_proof' || outcome === 'goal proof') return '#22c55e';
      if (outcome === 'positive') return '#14b8a6';
      if (outcome === 'negative') return '#94a3b8';
      if (outcome === 'blocked') return '#f59e0b';
      if (relevance === 'advances') return '#3b82f6';
      return '#818cf8';
    },

    primaryFactAtom(fact) {
      if (!fact || !Array.isArray(fact.atoms) || fact.atoms.length === 0) return null;
      return fact.atoms.find(atom => atom && atom.polarity === 'positive') || fact.atoms[0];
    },

    normalizedText(text) {
      return String(text || '').replace(/\s+/g, ' ').trim();
    },

    humanizeValue(value) {
      return this.normalizedText(value).replace(/[_-]+/g, ' ');
    },

    humanizeAtomObject(value) {
      return this.normalizedText(value).replace(/_/g, ' ');
    },

    articleFor(text) {
      return /^[aeiou]/i.test(this.normalizedText(text)) ? 'an' : 'a';
    },

    limitText(text, maxLen = null) {
      if (!maxLen) return text;
      return this.truncateDescription(text, maxLen);
    },

    formatAtomSummary(atom) {
      if (!atom || typeof atom !== 'object') return '';
      const subject = this.humanizeValue(atom.subject) || '?';
      const predicate = this.humanizeValue(atom.predicate) || '?';
      const object = this.humanizeAtomObject(atom.object) || '?';
      const polarity = this.humanizeValue(atom.polarity);
      return `${subject} ${predicate} ${object}${polarity ? ` (${polarity})` : ''}`;
    },

    compactAtomLine(atom, maxLen = 76) {
      if (!atom || typeof atom !== 'object') return '';
      const subject = this.humanizeValue(atom.subject) || '?';
      const predicate = this.humanizeValue(atom.predicate) || '?';
      const object = this.humanizeAtomObject(atom.object) || '?';
      return this.truncateDescription(`${subject} → ${predicate} → ${object}`, maxLen);
    },

    intelFactHeadline(fact, maxLen = 62) {
      if (!fact) return '';
      const atom = this.primaryFactAtom(fact);
      if (atom) {
        const subject = this.humanizeValue(atom.subject) || '?';
        const predicate = this.humanizeValue(atom.predicate) || '?';
        const object = this.humanizeAtomObject(atom.object) || '?';
        return this.truncateDescription(`${subject} ${predicate} ${object}`, maxLen);
      }
      const tags = Array.isArray(fact.tags)
        ? fact.tags.slice(0, 3).map(tag => this.humanizeValue(tag)).filter(Boolean)
        : [];
      const parts = [
        this.humanizeValue(fact.kind),
        this.humanizeValue(fact.outcome),
        ...tags,
      ].filter(Boolean);
      return this.truncateDescription(parts.join(' · ') || this.normalizedText(fact.description) || fact.id, maxLen);
    },

    intelFactFallbackLine(fact, maxLen = 76) {
      const tags = Array.isArray(fact?.tags)
        ? fact.tags.slice(0, 3).map(tag => this.humanizeValue(tag)).filter(Boolean)
        : [];
      const parts = [
        fact?.outcome ? `outcome ${this.humanizeValue(fact.outcome)}` : '',
        fact?.goal_relevance ? `goal ${this.humanizeValue(fact.goal_relevance)}` : '',
        ...tags,
      ].filter(Boolean);
      return this.truncateDescription(parts.join(' · ') || this.factAtomPreview(fact), maxLen);
    },

    factCardSummary(fact, maxLen = null) {
      if (!fact) return '';
      if (!this.hasStructuredFact(fact)) return this.limitText(fact.description || fact.id, maxLen);

      const atom = this.primaryFactAtom(fact);
      const headline = atom ? this.formatAtomSummary(atom) : '';
      const tags = Array.isArray(fact.tags)
        ? fact.tags.slice(0, 2).map(tag => this.humanizeValue(tag)).filter(Boolean)
        : [];
      const qualifiers = [];
      if (fact.outcome) qualifiers.push(this.humanizeValue(fact.outcome));
      if (fact.goal_relevance) qualifiers.push(this.humanizeValue(fact.goal_relevance));
      if (fact.next_policy) qualifiers.push(`next ${this.humanizeValue(fact.next_policy)}`);

      const fallbackParts = [
        this.humanizeValue(fact.kind),
        ...tags,
      ].filter(Boolean);
      const main = headline || fallbackParts.join(' / ') || this.normalizedText(fact.description) || fact.id;
      const suffix = qualifiers.slice(0, 2).join(' · ');
      return this.limitText([main, suffix].filter(Boolean).join(' · '), maxLen);
    },

    factUserSummary(fact, maxLen = null) {
      if (!fact) return '';
      if (!this.hasStructuredFact(fact)) return this.limitText(fact.description || fact.id, maxLen);

      const sentences = [];
      const kind = this.humanizeValue(fact.kind);
      const outcome = this.humanizeValue(fact.outcome);
      if (kind || outcome) {
        const pieces = ['This fact records'];
        pieces.push(kind ? `${this.articleFor(kind)} ${kind} observation` : 'a structured observation');
        if (outcome) pieces.push(`with a ${outcome} outcome`);
        sentences.push(`${pieces.join(' ')}.`);
      }
      if (fact.goal_relevance) {
        sentences.push(`Its relevance to the project goal is ${this.humanizeValue(fact.goal_relevance)}.`);
      }
      if (fact.next_policy) {
        sentences.push(`The recommended next step is ${this.humanizeValue(fact.next_policy)}.`);
      }
      if (Array.isArray(fact.tags) && fact.tags.length > 0) {
        sentences.push(`It is tagged as ${fact.tags.map(tag => this.humanizeValue(tag)).join(', ')}.`);
      }
      if (Array.isArray(fact.atoms) && fact.atoms.length > 0) {
        const atomLimit = maxLen ? 3 : fact.atoms.length;
        const evidence = fact.atoms
          .slice(0, atomLimit)
          .map(atom => this.formatAtomSummary(atom))
          .filter(Boolean)
          .join('; ');
        if (evidence) {
          const omitted = fact.atoms.length > atomLimit ? `, with ${fact.atoms.length - atomLimit} more evidence item(s)` : '';
          sentences.push(`The supporting evidence says that ${evidence}${omitted}.`);
        }
      }

      const fallback = this.normalizedText(fact.description);
      if (sentences.length === 0 && fallback) sentences.push(fallback);
      if (sentences.length === 0) sentences.push(fact.id);
      return this.limitText(sentences.join(' '), maxLen);
    },

    formatAtom(atom) {
      if (!atom || typeof atom !== 'object') return '';
      const subject = atom.subject || '?';
      const predicate = atom.predicate || '?';
      const object = atom.object || '?';
      const polarity = atom.polarity ? ` [${atom.polarity}]` : '';
      return `${subject} --${predicate}--> ${object}${polarity}`;
    },

    hasStructuredIntent(intent) {
      return !!(intent && (intent.kind || intent.stop_condition));
    },

    intentActionLabel(intent) {
      const kind = this.humanizeValue(intent?.kind).toLowerCase();
      if (kind) return kind;
      const description = this.normalizedText(intent?.description).toLowerCase();
      if (!description) return 'intent';
      if (description === 'bootstrap') return 'bootstrap';
      if (/\b(scan|enumerate|discover|fingerprint|list|map|identify|dirb|ffuf|wpscan|nmap|masscan)\b/.test(description)) return 'enumerate';
      if (/\b(validate|verify|confirm|check|test|prove)\b/.test(description)) return 'validate';
      if (/\b(exploit|trigger|upload|execute|shell|rce|inject|brute|login|write|read)\b/.test(description)) return 'exploit';
      if (/\b(complete|completed|achieved|root access|flag found|goal)\b/.test(description)) return 'complete_check';
      if (/\b(branch|pivot|alternative|try another|fallback)\b/.test(description)) return 'branch';
      return 'intent';
    },

    intentEdgeStyle(intent) {
      const action = this.intentActionLabel(intent);
      const palette = {
        enumerate: { edgeColor: '#64748b', edgeTextColor: '#475569', edgeBackground: '#f8fafc', edgeLineStyle: 'solid', edgeWidth: 1.8 },
        validate: { edgeColor: '#f59e0b', edgeTextColor: '#92400e', edgeBackground: '#fffbeb', edgeLineStyle: 'solid', edgeWidth: 1.9 },
        exploit: { edgeColor: '#f97316', edgeTextColor: '#9a3412', edgeBackground: '#fff7ed', edgeLineStyle: 'solid', edgeWidth: 2.25 },
        complete_check: { edgeColor: '#22c55e', edgeTextColor: '#166534', edgeBackground: '#f0fdf4', edgeLineStyle: 'solid', edgeWidth: 2.35 },
        branch: { edgeColor: '#8b5cf6', edgeTextColor: '#5b21b6', edgeBackground: '#f5f3ff', edgeLineStyle: 'dashed', edgeWidth: 1.9 },
        bootstrap: { edgeColor: '#94a3b8', edgeTextColor: '#475569', edgeBackground: '#f8fafc', edgeLineStyle: 'dashed', edgeWidth: 1.8 },
        intent: { edgeColor: '#94a3b8', edgeTextColor: '#64748b', edgeBackground: '#f8fafc', edgeLineStyle: 'solid', edgeWidth: 1.7 },
      };
      return palette[action] || palette.intent;
    },

    intentStructuredBadges(intent) {
      if (!intent) return [];
      const badges = [];
      if (intent.kind) badges.push(intent.kind);
      badges.push(this.intentStatusLabel(intent));
      if (intent.stop_condition) badges.push(intent.stop_condition);
      return badges;
    },

    intentStructuredSummary(intent) {
      if (!intent) return '';
      const parts = this.intentStructuredBadges(intent);
      return parts.length ? parts.join(' / ') : this.truncateDescription(intent.description || intent.id, 72);
    },

    intentUserSummary(intent, maxLen = null) {
      if (!intent) return '';
      if (!this.hasStructuredIntent(intent)) return this.limitText(intent.description || intent.id, maxLen);

      const decision = this.normalizedText(intent.description);
      const from = Array.isArray(intent.from) && intent.from.length > 0 ? intent.from.join(', ') : 'the current context';
      const to = intent.to || 'an open exploration branch';
      const kind = this.humanizeValue(intent.kind);
      const sentences = [];
      if (decision && decision !== 'bootstrap') {
        sentences.push(`The agent decided to ${decision}.`);
      } else if (kind) {
        sentences.push(`The agent opened a ${kind} intent.`);
      } else {
        sentences.push(`The agent opened an intent for the next step.`);
      }
      sentences.push(`It is currently ${this.intentStatusLabel(intent)} and connects ${from} to ${to}.`);
      if (kind && decision && decision !== 'bootstrap') {
        sentences.push(`This decision is categorized as ${kind}.`);
      }
      if (intent.stop_condition) {
        sentences.push(`It should stop when ${this.humanizeValue(intent.stop_condition)}.`);
      }
      return this.limitText(sentences.join(' '), maxLen);
    },

    selectedFactProducingIntent() {
      const factId = this.selectedFactId();
      return factId ? this.getProducingIntent(factId) : null;
    },

    selectedFactRecords() {
      if (!this.project || this.selectedFacts.length === 0) return [];
      const factsById = new Map(this.project.facts.map(f => [f.id, f]));
      return this.selectedFacts.map(fid => factsById.get(fid)).filter(Boolean);
    },

    selectedIntentId() {
      return this.selectedNode?.type === 'intent' ? this.selectedNode.id : null;
    },

    selectedIntentRecord() {
      const intentId = this.selectedIntentId();
      if (!this.project || !intentId) return null;
      return this.project.intents.find(i => i.id === intentId) || null;
    },

    selectedOpenIntentRecord() {
      const intent = this.selectedIntentRecord();
      if (!intent || intent.to || !this.projectIsActive()) return null;
      return intent;
    },

    selectedActionableOpenIntentRecord() {
      const intent = this.selectedOpenIntentRecord();
      if (!intent) return null;
      const actor = this.actorName();
      return !intent.worker || intent.worker === actor ? intent : null;
    },

    selectedReleasableOpenIntentRecord() {
      const intent = this.selectedOpenIntentRecord();
      if (!intent?.worker) return null;
      return intent.worker === this.actorName() ? intent : null;
    },

    selectedIntentPrimaryActionLabel() {
      const intent = this.selectedOpenIntentRecord();
      if (!intent) return this.t('Claim');
      if (!intent.worker) return this.t('Claim');
      return intent.worker === this.actorName() ? this.t('Heartbeat') : this.t('Claimed');
    },

    getFactRecord(fid) {
      return this.project ? this.project.facts.find(f => f.id === fid) || null : null;
    },

    intentDotClass(i) {
      if (i.to) return 'bg-teal-400';
      if (this.isBootstrapIntent(i)) return i.worker ? 'bg-orange-400' : 'bg-orange-200';
      return i.worker ? 'bg-warning/80' : 'bg-slate-300';
    },
    intentStatusClass(i) {
      if (i.to) return 'text-success';
      if (this.isBootstrapIntent(i)) return i.worker ? 'text-orange-600' : 'text-orange-400';
      return i.worker ? 'text-warning' : 'text-base-content/50';
    },
    intentStatusLabel(i) {
      if (i.to) return this.t('Concluded');
      if (this.isBootstrapIntent(i)) return i.worker ? this.t('Bootstrap Running') : this.t('Bootstrap Pending');
      return i.worker ? this.t('In Progress') : this.t('Unclaimed');
    },

    // ── Facts / Intents index tabs ──

    sortedFactsForIndex() {
      if (!this.project) return [];
      const facts = [...this.project.facts];
      facts.sort((a, b) => {
        if (a.id === 'origin') return -1;
        if (b.id === 'origin') return 1;
        if (a.id === 'goal') return -1;
        if (b.id === 'goal') return 1;
        return a.id.localeCompare(b.id);
      });
      return facts;
    },

    sortedIntentsForIndex() {
      if (!this.project) return [];
      const intents = [...this.project.intents];
      intents.sort((a, b) => {
        const aDone = a.to ? 0 : a.worker ? 1 : 2;
        const bDone = b.to ? 0 : b.worker ? 1 : 2;
        if (aDone !== bDone) return aDone - bDone;
        return a.id.localeCompare(b.id);
      });
      return intents;
    },

    truncateDescription(text, maxLen) {
      if (!text) return '';
      const chars = Array.from(text);
      if (chars.length <= maxLen) return text;
      return chars.slice(0, maxLen).join('') + '…';
    },

    showFactFromIndex(factId) {
      if (!factId) return;
      this.selectedFacts = [factId];
      this.selectFact(factId);
      this.sideTab = 'detail';
      this.centerGraphOnFact(factId);
    },

    showIntentFromIndex(intentId) {
      if (!intentId) return;
      this.selectIntent(intentId);
      this.sideTab = 'detail';
      this.centerGraphOnIntent(intentId);
    },

    intentIndexBadgeClass(intent) {
      if (this.isBootstrapIntent(intent)) return 'bg-orange-100 text-orange-700 border border-orange-200';
      if (intent.to) return 'bg-success/10 text-success';
      if (intent.worker) return 'bg-warning/10 text-warning';
      return 'bg-base-300 text-base-content/60';
    },

    intentIndexStatusClass(intent) {
      if (this.isBootstrapIntent(intent)) return intent.worker ? 'bg-orange-100 text-orange-700' : 'bg-orange-50 text-orange-500';
      if (intent.to) return 'bg-success/10 text-success';
      if (intent.worker) return 'bg-warning/10 text-warning';
      return 'bg-base-200 text-base-content/50';
    },

    timelineEvents() {
      if (this.replay.active) return this.replay.visibleEvents;
      if (!this.project) return [];
      if (this._timelineEventsCacheProject === this.project) return this._timelineEventsCache;

      const events = [];
      let order = 0;
      const origin = this.getFactRecord('origin');
      const goal = this.getFactRecord('goal');

      events.push({
        id: `project-created-${this.project.project.id}`,
        type: 'project_created',
        timestamp: this.project.project.created_at,
        actor: 'system',
        title: this.project.project.title,
        meta: [
          origin ? (this.hasStructuredFact(origin) ? this.factUserSummary(origin, 180) : origin.description) : null,
          goal ? `goal: ${this.hasStructuredFact(goal) ? this.factUserSummary(goal, 180) : goal.description}` : null
        ].filter(Boolean),
        targetType: 'fact',
        targetId: 'origin',
        order: order++,
        intentId: null,
        producedFactId: null,
        sourceFactIds: [],
      });

      for (const hint of this.project.hints) {
        events.push({
          id: `hint-${hint.id}`,
          type: 'hint_added',
          timestamp: hint.created_at,
          actor: hint.creator,
          title: hint.content,
          meta: [],
          targetType: 'hints',
          targetId: hint.id,
          order: order++,
          intentId: null,
          producedFactId: null,
          sourceFactIds: [],
        });
      }

      for (const intent of this.project.intents) {
        events.push({
          id: `intent-declared-${intent.id}`,
          type: 'intent_declared',
          timestamp: intent.created_at,
          actor: intent.creator,
          title: this.hasStructuredIntent(intent) ? this.intentUserSummary(intent, 220) : intent.description,
          meta: [intent.id, `from ${intent.from.join(', ')}`],
          targetType: 'intent',
          targetId: intent.id,
          order: order++,
          intentId: intent.id,
          producedFactId: null,
          sourceFactIds: [...intent.from],
        });

        if (!intent.concluded_at || !intent.to) continue;

        if (intent.to === 'goal') {
          events.push({
            id: `project-completed-${intent.id}`,
            type: 'project_completed',
            timestamp: intent.concluded_at,
            actor: intent.worker || intent.creator,
            title: this.hasStructuredIntent(intent) ? this.intentUserSummary(intent, 220) : intent.description,
            meta: [intent.id, `from ${intent.from.join(', ')}`],
            targetType: 'fact',
            targetId: 'goal',
            order: order++,
            intentId: intent.id,
            producedFactId: 'goal',
            sourceFactIds: [...intent.from],
          });
          continue;
        }

        const fact = this.getFactRecord(intent.to);
        events.push({
          id: `intent-concluded-${intent.id}`,
          type: 'intent_concluded',
          timestamp: intent.concluded_at,
          actor: intent.worker || intent.creator,
          title: fact ? (this.hasStructuredFact(fact) ? this.factUserSummary(fact, 220) : fact.description) : intent.description,
          meta: [intent.id, `produced ${intent.to}`, `from ${intent.from.join(', ')}`],
          targetType: 'fact',
          targetId: intent.to,
          order: order++,
          intentId: intent.id,
          producedFactId: intent.to,
          sourceFactIds: [...intent.from],
        });
      }

      const chronological = [...events].sort((a, b) =>
        a.timestamp.localeCompare(b.timestamp) || a.order - b.order
      );

      const resolved = [];
      for (let i = 0; i < chronological.length;) {
        const bucket = [chronological[i]];
        let j = i + 1;
        while (j < chronological.length && chronological[j].timestamp === chronological[i].timestamp) {
          bucket.push(chronological[j]);
          j += 1;
        }
        resolved.push(...this.resolveTimelineBucket(bucket));
        i = j;
      }

      const cached = resolved.map((entry, index) => ({ ...entry, isLast: index === resolved.length - 1 }));
      this._timelineEventsCacheProject = this.project;
      this._timelineEventsCache = cached;
      return cached;
    },

    resolveTimelineBucket(bucket) {
      if (bucket.length <= 1) return bucket;

      const eventById = new Map(bucket.map(event => [event.id, event]));
      const declareEventIdByIntent = new Map();
      const produceEventIdByFact = new Map();
      const outgoing = new Map(bucket.map(event => [event.id, new Set()]));
      const incomingCount = new Map(bucket.map(event => [event.id, 0]));

      const addDependency = (beforeId, afterId) => {
        if (!beforeId || !afterId || beforeId === afterId) return;
        const deps = outgoing.get(beforeId);
        if (!deps || deps.has(afterId)) return;
        deps.add(afterId);
        incomingCount.set(afterId, (incomingCount.get(afterId) || 0) + 1);
      };

      for (const event of bucket) {
        if (event.type === 'intent_declared') declareEventIdByIntent.set(event.intentId, event.id);
        if (event.producedFactId) produceEventIdByFact.set(event.producedFactId, event.id);
      }

      for (const event of bucket) {
        if ((event.type === 'intent_concluded' || event.type === 'project_completed') && event.intentId) {
          addDependency(declareEventIdByIntent.get(event.intentId), event.id);
        }

        if (!event.sourceFactIds?.length) continue;
        for (const factId of event.sourceFactIds) {
          addDependency(produceEventIdByFact.get(factId), event.id);
        }
      }

      const ready = bucket
        .filter(event => incomingCount.get(event.id) === 0)
        .sort((a, b) => a.order - b.order);
      const ordered = [];

      while (ready.length > 0) {
        const event = ready.shift();
        ordered.push(event);
        for (const nextId of outgoing.get(event.id) || []) {
          incomingCount.set(nextId, incomingCount.get(nextId) - 1);
          if (incomingCount.get(nextId) === 0) {
            ready.push(eventById.get(nextId));
            ready.sort((a, b) => a.order - b.order);
          }
        }
      }

      if (ordered.length === bucket.length) return ordered;

      const remainingIds = bucket
        .filter(event => !ordered.some(placed => placed.id === event.id))
        .sort((a, b) => a.order - b.order);
      return [...ordered, ...remainingIds];
    },

    timelineEventBadge(entry) {
      const labels = {
        project_created: this.t('Project'),
        hint_added: this.t('Hint'),
        reason_started: this.t('Reason'),
        intent_declared: this.t('Intent'),
        intent_running: this.t('Execute'),
        intent_concluded: this.t('Conclude'),
        project_completed: this.t('Complete'),
      };
      return labels[entry.type] || this.t('Event');
    },

    timelineEventBadgeClass(entry) {
      const classes = {
        project_created: 'bg-base-300 text-base-content/80',
        hint_added: 'bg-warning/10 text-warning',
        reason_started: 'bg-info/10 text-info',
        intent_declared: 'bg-secondary/10 text-secondary',
        intent_running: 'bg-warning/10 text-warning',
        intent_concluded: 'bg-success/10 text-success',
        project_completed: 'bg-error/10 text-rose-700',
      };
      return classes[entry.type] || 'bg-base-300 text-base-content/80';
    },

    timelineEventIsInteractive(entry) {
      return entry?.targetType === 'fact' || entry?.targetType === 'intent' || entry?.targetType === 'hints' || entry?.targetType === 'reason';
    },

    timelineEventTriggersGraphFocus(entry) {
      return entry?.targetType === 'fact' || entry?.targetType === 'intent';
    },

    timelineEventDotClass(entry) {
      const classes = {
        project_created: 'bg-slate-400',
        hint_added: 'bg-warning/80',
        reason_started: 'bg-sky-400',
        intent_declared: 'bg-violet-400',
        intent_running: 'bg-warning/80',
        intent_concluded: 'bg-teal-400',
        project_completed: 'bg-rose-400',
      };
      return classes[entry.type] || 'bg-slate-300';
    },

    timelineEntryButtonClass(entry) {
      const base = this.timelineEventIsInteractive(entry) ? 'cursor-pointer hover:bg-base-200/70' : 'cursor-default';
      return this.timelineEntryIsSelected(entry)
        ? `${base} bg-primary/10/80 ring-1 ring-primary/30`
        : base;
    },

    timelineEntryDomId(entryId) {
      return `timeline-entry-${entryId}`;
    },

    timelineEntryElement(entryId) {
      return document.getElementById(this.timelineEntryDomId(entryId));
    },

    timelineTargetEntryIdForGraphSelection(allowMultiFact = false) {
      const events = this.timelineEvents();
      if (this.selectedNode?.type === 'intent') {
        const selectedIntentId = this.selectedNode.id;
        return events.find(entry => entry.type === 'intent_declared' && entry.intentId === selectedIntentId)?.id
          || events.find(entry => entry.intentId === selectedIntentId)?.id
          || null;
      }

      if (this.selectedNode?.type === 'fact') {
        if (!allowMultiFact && this.selectedFacts.length > 1) return null;
        const selectedFactId = this.selectedNode.id;
        return events.find(entry => entry.targetType === 'fact' && entry.targetId === selectedFactId)?.id || null;
      }

      return null;
    },

    activeTimelineEntryId(allowMultiFact = false) {
      return this.selectedTimelineEntryId || this.timelineTargetEntryIdForGraphSelection(allowMultiFact);
    },

    latestTimelineEntryId() {
      const events = this.timelineEvents();
      return events.length > 0 ? events[events.length - 1].id : null;
    },

    timelineEntryIsSelected(entry) {
      return !!entry && this.activeTimelineEntryId(false) === entry.id;
    },

    selectedTimelineSummary() {
      const targetEntryId = this.activeTimelineEntryId(false);
      if (!targetEntryId) return null;

      const events = this.timelineEvents();
      const index = events.findIndex(entry => entry.id === targetEntryId);
      if (index < 0) return null;

      const entry = events[index];
      const total = events.length;
      const sequencePercent = total <= 1 ? 100 : Math.round((index / (total - 1)) * 100);
      const replayMode = this.replay.active;
      const totalDuration = replayMode
        ? this.replayTimelineElapsedDurationMs(events, Math.max(0, total - 1))
        : Math.max(0, Date.parse(events[total - 1].timestamp) - Date.parse(events[0].timestamp));
      const elapsedDuration = replayMode
        ? this.replayTimelineElapsedDurationMs(events, index)
        : Math.max(0, Date.parse(entry.timestamp) - Date.parse(events[0].timestamp));
      const timePercent = totalDuration === 0 ? 100 : Math.round((elapsedDuration / totalDuration) * 100);

      return {
        sequencePercent,
        sequenceLabel: `${index + 1} / ${total} · ${sequencePercent}%`,
        timePercent,
        timeLabel: `${this.formatDurationMs(elapsedDuration)} / ${this.formatDurationMs(totalDuration)} · ${timePercent}%`,
      };
    },

    scrollTimelineToEntry(entryId, options = {}) {
      const { flash = true } = options;
      if (!entryId) return;
      this.$nextTick(() => {
        requestAnimationFrame(() => {
          const entry = this.timelineEntryElement(entryId);
          if (!entry) return;
          const panel = entry.closest('.overflow-y-auto');
          if (!panel) return;
          const top = entry.offsetTop - panel.clientHeight / 2 + entry.clientHeight / 2;
          const targetTop = Math.max(0, top);
          panel.scrollTo({ top: targetTop, behavior: 'smooth' });
          if (!flash) return;
          const travel = Math.abs(panel.scrollTop - targetTop);
          const flashDelay = Math.min(450, Math.max(140, travel * 0.18));
          setTimeout(() => {
            entry.classList.remove('timeline-flash');
            void entry.offsetWidth;
            entry.classList.add('timeline-flash');
            setTimeout(() => entry.classList.remove('timeline-flash'), 1000);
          }, flashDelay);
        });
      });
    },

    followReplayTimelineTail() {
      if (!this.replay.active || this.sideTab !== 'log') return;
      this.scrollTimelineToEntry(this.latestTimelineEntryId(), { flash: false });
    },

    scrollTimelineToSelection() {
      if (this.sideTab !== 'log') return;
      this.scrollTimelineToEntry(this.activeTimelineEntryId(true));
    },

    openHintTimelineEntry(hintId) {
      if (!hintId) return;
      const entry = this.timelineEvents().find(event => event.type === 'hint_added' && event.targetId === hintId);
      if (!entry) return;
      this.sideTab = 'log';
      this.openTimelineEntry(entry);
      this.scrollTimelineToEntry(entry.id);
    },

    openTimelineEntry(entry, options = {}) {
      const { centerGraph = true } = options;
      if (!entry || !this.timelineEventIsInteractive(entry)) return;
      if (!this.timelineEventTriggersGraphFocus(entry)) {
        this.selectedTimelineEntryId = entry.id;
        this.clearGraphSelection(true);
        return;
      }
      if (entry.targetType === 'intent' && entry.targetId) {
        this.selectIntent(entry.targetId);
        this.selectedTimelineEntryId = entry.id;
        if (centerGraph) this.centerGraphOnIntent(entry.targetId);
        return;
      }
      if (entry.targetType === 'fact' && entry.targetId) {
        this.selectedFacts = [entry.targetId];
        this.selectFact(entry.targetId);
        this.selectedTimelineEntryId = entry.id;
        if (centerGraph) this.centerGraphOnFact(entry.targetId);
      }
    },

    formatTime(ts) { if (!ts) return ''; return new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}); },
    formatDate(ts) { if (!ts) return ''; const d = new Date(ts); return d.toLocaleDateString([],{year:'numeric',month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); },
    formatTimelineDate(ts) { if (!ts) return ''; return new Date(ts).toLocaleDateString([],{year:'numeric',month:'short',day:'numeric'}); },
    formatDurationMs(ms) {
      const totalSeconds = Math.max(0, Math.round(ms / 1000));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      if (hours > 0) return `${hours}h ${minutes}m`;
      if (minutes > 0) return `${minutes}m ${seconds}s`;
      return `${seconds}s`;
    },

    async createProject() {
      try {
        const actor = this.actorName();
        const hintContents = this.newProject.hints.filter(h => h.content?.trim());
        const body = {
          title: this.newProject.title,
          origin: this.newProject.origin,
          goal: this.newProject.goal,
          bootstrap_enabled: this.newProject.bootstrap
        };
        const hints = hintContents.map(h => ({ content: h.content.trim(), creator: actor }));
        if (hints.length > 0) body.hints = hints;
        const data = await this.api('POST', '/projects', body);
        this.showNewProject = false;
        this.newProject = { title:'', origin:'', goal:'', bootstrap: true, hints: [{ content:'' }] };
        await this.loadProjects();
        await this.openProject(data.project.id);
        this.showToast(this.t('Project created'));
      } catch(e) { this.showToast(e.message, 'error'); }
    },

    openCreateIntent() {
      if (!this.canActOnSelectedFacts()) return;
      this.intentForm = { description:'' };
      this.showIntentModal = true;
    },

    async createIntent(claim = false) {
      try {
        const actor = this.actorName();
        await this.api('POST', `/projects/${this.selectedProjectId}/intents`, {
          from: this.selectedFacts,
          description: this.intentForm.description,
          creator: actor,
          worker: claim ? actor : null,
        });
        this.showIntentModal = false;
        await this.loadProject(this.selectedProjectId);
        this.updateGraph();
        this.showToast(claim ? this.t('Intent declared and claimed') : this.t('Intent declared'));
      } catch(e) { this.showToast(e.message, 'error'); }
    },

    async sendHeartbeatForSelectedIntent() {
      const intent = this.selectedActionableOpenIntentRecord();
      if (!intent) return;
      try {
        const actor = this.actorName();
        const claiming = !intent.worker;
        await this.api('POST', `/projects/${this.selectedProjectId}/intents/${intent.id}/heartbeat`, { worker: actor });
        await this.loadProject(this.selectedProjectId);
        this.updateGraph();
        this.showToast(claiming ? this.t('Intent claimed') : this.t('Heartbeat sent'));
      } catch(e) { this.showToast(e.message, 'error'); }
    },

    async releaseSelectedIntent() {
      const intent = this.selectedReleasableOpenIntentRecord();
      if (!intent) return;
      try {
        const actor = this.actorName();
        await this.api('POST', `/projects/${this.selectedProjectId}/intents/${intent.id}/release`, { worker: actor });
        await this.loadProject(this.selectedProjectId);
        this.updateGraph();
        this.showToast(this.t('Intent released'));
      } catch(e) { this.showToast(e.message, 'error'); }
    },

    openConclude(intent) { this.concludeForm = { description:'', intentId: intent.id }; this.showConcludeModal = true; },

    async concludeIntent() {
      try {
        const actor = this.actorName();
        await this.api('POST', `/projects/${this.selectedProjectId}/intents/${this.concludeForm.intentId}/conclude`, { worker: actor, description: this.concludeForm.description });
        this.showConcludeModal = false;
        this.selectedNode = null;
        await this.loadProject(this.selectedProjectId);
        this.updateGraph();
        this.showToast(this.t('Intent concluded'));
      } catch(e) { this.showToast(e.message, 'error'); }
    },

    openCompleteProject() {
      if (!this.canActOnSelectedFacts()) return;
      this.completeForm = { description:'' };
      this.showCompleteModal = true;
    },

    openHintModal() {
      if (!this.projectCanWriteHints()) return;
      this.hintForm = { content:'' };
      this.showHintModal = true;
    },

    async completeProject() {
      try {
        const actor = this.actorName();
        await this.api('POST', `/projects/${this.selectedProjectId}/complete`, { from: this.selectedFacts, description: this.completeForm.description, worker: actor });
        this.showCompleteModal = false;
        await this.loadProjects();
        await this.loadProject(this.selectedProjectId);
        this.updateGraph();
        this.showToast(this.t('Project completed'));
      } catch(e) { this.showToast(e.message, 'error'); }
    },

    async addHint() {
      if (!this.projectCanWriteHints()) return;
      try {
        const actor = this.actorName();
        await this.api('POST', `/projects/${this.selectedProjectId}/hints`, { content: this.hintForm.content, creator: actor });
        this.showHintModal = false;
        this.hintForm = { content:'' };
        await this.loadProjects();
        await this.loadProject(this.selectedProjectId);
        this.sideTab = 'hints';
        this.showToast(this.t('Hint added'));
      } catch(e) { this.showToast(e.message, 'error'); }
    },

    saveLocalSettings() {
      try {
        this.localPrefs.actor_name = this.actorName();
        this.localPrefs.layout_mode = this.isValidLayoutMode(this.localPrefs.layout_mode) ? this.localPrefs.layout_mode : 'dagre_lr';
        this.layoutMode = this.localPrefs.layout_mode;
        this.saveLocalPrefs();
        if (this.cy) this.cy.layout(this.layoutOpts()).run();
        this.showLocalPrefs = false;
        this.showToast(this.t('Local preferences saved'));
      } catch(e) { this.showToast(e.message, 'error'); }
    },

    async saveServerSettings() {
      try {
        await this.api('PUT', '/settings', this.settingsForm);
        this.showSettings = false;
        this.showToast(this.t('Server settings saved'));
      } catch(e) { this.showToast(e.message, 'error'); }
    },
  };
}
</script>
